<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" width="820" height="190" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Container -->
  <rect width="820" height="190" rx="10" fill="#11161d" stroke="#2c3846" stroke-width="1.5"/>

  <!-- Top row nodes -->
  <!-- [RF ANT] -->
  <rect x="28" y="26" width="110" height="58" rx="6" fill="#18202a" stroke="#64748b" stroke-width="1.4"/>
  <text x="83" y="51" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">[RF</text>
  <text x="83" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">ANT]</text>

  <!-- Arrow 1 -->
  <line x1="138" y1="55" x2="188" y2="55" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- [CC1101 (SPI)] -->
  <rect x="194" y="26" width="144" height="58" rx="6" fill="#18202a" stroke="#5eead4" stroke-opacity="0.65" stroke-width="1.4"/>
  <text x="266" y="51" text-anchor="middle" font-size="14" font-weight="700" fill="#5eead4">CC1101</text>
  <text x="266" y="70" text-anchor="middle" font-size="13" fill="#cbd5e1">(SPI)</text>

  <!-- Arrow 2 -->
  <line x1="338" y1="55" x2="388" y2="55" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- [ESP32 RMT Engine] -->
  <rect x="394" y="26" width="190" height="58" rx="6" fill="#18202a" stroke="#5eead4" stroke-width="1.6"/>
  <text x="489" y="51" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">ESP32 RMT</text>
  <text x="489" y="70" text-anchor="middle" font-size="13" fill="#5eead4">Engine</text>

  <!-- Arrow 3 -->
  <line x1="584" y1="55" x2="634" y2="55" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- [NVS Storage] -->
  <rect x="640" y="26" width="152" height="58" rx="6" fill="#18202a" stroke="#64748b" stroke-width="1.4"/>
  <text x="716" y="51" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">NVS</text>
  <text x="716" y="70" text-anchor="middle" font-size="13" fill="#cbd5e1">Storage</text>

  <!-- Vertical link to OLED UI -->
  <line x1="489" y1="84" x2="489" y2="112" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- [OLED UI + Encoder] -->
  <rect x="334" y="114" width="310" height="56" rx="6" fill="#18202a" stroke="#475569" stroke-width="1.4"/>
  <text x="489" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">[OLED UI + Encoder]</text>
  <text x="489" y="158" text-anchor="middle" font-size="13" fill="#5eead4">(RX · SCAN · LOCK · TX)</text>
</svg>
