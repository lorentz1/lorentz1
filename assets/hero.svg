<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#f0a080"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- corner brackets -->
  <g stroke="#58A6FF" stroke-opacity="0.45" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M24 46 V24 H46"/>
    <path d="M1176 274 V296 H1154"/>
  </g>

  <!-- LEFT: title block, vertically centred (content spans y 82..246) -->
  <text x="64" y="130" font-size="64" font-weight="800" fill="#f0f6fc" letter-spacing="3">LORENTZ</text>
  <rect x="66" y="150" width="300" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="66" y="192" font-size="18" fill="#8b949e" letter-spacing="1.6">DEFESA CIBERNÉTICA · ELETRÔNICA · IoT · ROBÓTICA</text>
  <text x="66" y="222" font-size="16" fill="#D97757" letter-spacing="0.4">orquestrando agentes de IA · firmware × hardware × segurança</text>
  <text x="66" y="250" font-size="13" fill="#6e7681" font-family="Consolas, 'Courier New', monospace">&gt; build_fast() · stay_assisted() · secure_by_design()</text>

  <!-- separator -->
  <line x1="700" y1="56" x2="700" y2="264" stroke="#30363d" stroke-width="1.5"/>

  <!-- RIGHT: 3 x 2 icon grid.
       Columns at x = 810, 950, 1090. Each icon fits a ±32 px box.
       Row 1: icon centre y = 100, label baseline y = 156.
       Row 2: icon centre y = 212, label baseline y = 268. -->
  <g font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="1.5">
    <text x="810" y="156">DRONES</text>
    <text x="950" y="156">ROBÓTICA</text>
    <text x="1090" y="156">RF / SUB-GHz</text>
    <text x="810" y="268">PWM / IGBT</text>
    <text x="950" y="268">CIs / DATASHEETS</text>
    <text x="1090" y="268">SEGURANÇA</text>
  </g>

  <!-- Drone (±58 x ±31) -->
  <g transform="translate(810,100)" stroke="#D97757" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="0" x2="-40" y2="-24"/><line x1="0" y1="0" x2="40" y2="-24"/>
    <line x1="0" y1="0" x2="-40" y2="24"/><line x1="0" y1="0" x2="40" y2="24"/>
    <ellipse cx="-40" cy="-24" rx="18" ry="4.5" stroke-opacity="0.85"/>
    <ellipse cx="40" cy="-24" rx="18" ry="4.5" stroke-opacity="0.85"/>
    <ellipse cx="-40" cy="24" rx="18" ry="4.5" stroke-opacity="0.85"/>
    <ellipse cx="40" cy="24" rx="18" ry="4.5" stroke-opacity="0.85"/>
    <circle cx="-40" cy="-24" r="3"/><circle cx="40" cy="-24" r="3"/>
    <circle cx="-40" cy="24" r="3"/><circle cx="40" cy="24" r="3"/>
    <rect x="-15" y="-10" width="30" height="20" rx="6"/>
    <circle cx="0" cy="13" r="3.5"/>
  </g>

  <!-- Robot head (±30 x -32..+20) -->
  <g transform="translate(950,106)" stroke="#3FB950" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-20" x2="0" y2="-29"/><circle cx="0" cy="-32" r="3" fill="#3FB950"/>
    <rect x="-24" y="-20" width="48" height="40" rx="8"/>
    <circle cx="-10" cy="-3" r="4.5" fill="#3FB950"/><circle cx="10" cy="-3" r="4.5" fill="#3FB950"/>
    <line x1="-10" y1="11" x2="10" y2="11"/>
    <line x1="-29" y1="-5" x2="-29" y2="7"/><line x1="29" y1="-5" x2="29" y2="7"/>
  </g>

  <!-- RF antenna (±19 x -30..+26) -->
  <g transform="translate(1090,102)" stroke="#58A6FF" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="0" y1="-12" x2="0" y2="24"/><line x1="-9" y1="24" x2="9" y2="24"/>
    <circle cx="0" cy="-12" r="3.2" fill="#58A6FF"/>
    <path d="M7 -20 A10 10 0 0 1 7 -4"/><path d="M13 -25 A17 17 0 0 1 13 1"/><path d="M19 -30 A24 24 0 0 1 19 6"/>
    <path d="M-7 -20 A10 10 0 0 0 -7 -4"/><path d="M-13 -25 A17 17 0 0 0 -13 1"/><path d="M-19 -30 A24 24 0 0 0 -19 6"/>
  </g>

  <!-- PWM wave (±50 x ±12) -->
  <g transform="translate(810,212)" stroke="#D97757" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="-50,12 -50,-12 -32,-12 -32,12 -16,12 -16,-12 4,-12 4,12 18,12 18,-12 38,-12 38,12 50,12"/>
  </g>

  <!-- IC chip (±32 x ±26) -->
  <g transform="translate(950,212)" stroke="#3FB950" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-24" y="-17" width="48" height="34" rx="4"/>
    <line x1="-24" y1="-9" x2="-32" y2="-9"/><line x1="-24" y1="0" x2="-32" y2="0"/><line x1="-24" y1="9" x2="-32" y2="9"/>
    <line x1="24" y1="-9" x2="32" y2="-9"/><line x1="24" y1="0" x2="32" y2="0"/><line x1="24" y1="9" x2="32" y2="9"/>
    <line x1="-9" y1="-17" x2="-9" y2="-25"/><line x1="9" y1="-17" x2="9" y2="-25"/>
    <line x1="-9" y1="17" x2="-9" y2="25"/><line x1="9" y1="17" x2="9" y2="25"/>
    <circle cx="-14" cy="-7" r="2.8" fill="#3FB950"/>
  </g>

  <!-- Shield (±21 x -26..+28) -->
  <g transform="translate(1090,210)" stroke="#58A6FF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -26 L21 -16 L21 3 Q21 19 0 28 Q-21 19 -21 3 L-21 -16 Z"/>
    <polyline points="-9,0 -2,9 11,-9"/>
  </g>
</svg>
