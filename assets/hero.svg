<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#f0a080"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- subtle circuit traces -->
  <g stroke="#D97757" stroke-opacity="0.12" stroke-width="2" fill="none">
    <path d="M0 60 H120 L150 90 H260"/>
    <path d="M0 250 H90 L130 210 H230"/>
    <path d="M1200 110 H1080 L1050 140 H900"/>
  </g>
  <g fill="#D97757" fill-opacity="0.18">
    <circle cx="260" cy="90" r="3"/><circle cx="230" cy="210" r="3"/><circle cx="900" cy="140" r="3"/>
  </g>

  <!-- corner brackets (cyberdeck vibe) -->
  <g stroke="#58A6FF" stroke-opacity="0.5" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M22 44 V22 H44"/><path d="M1178 276 V298 H1156"/>
  </g>

  <!-- title block -->
  <text x="60" y="132" font-size="66" font-weight="800" fill="#f0f6fc" letter-spacing="2">LORENTZ</text>
  <rect x="62" y="148" width="312" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="64" y="186" font-size="19" fill="#8b949e" letter-spacing="1.5">DEFESA CIBERNÉTICA · ELETRÔNICA · IoT · ROBÓTICA</text>
  <text x="64" y="214" font-size="16" fill="#D97757" letter-spacing="0.5">orquestrando agentes de IA · firmware × hardware × segurança</text>
  <text x="64" y="252" font-size="13" fill="#6e7681" font-family="Consolas, 'Courier New', monospace">&gt; build_fast() · stay_assisted() · secure_by_design()</text>

  <!-- ICON CLUSTER -->
  <!-- Row 1 -->
  <!-- Drone / quadcopter -->
  <g transform="translate(800,112)" stroke="#D97757" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="0" x2="-46" y2="-28"/><line x1="0" y1="0" x2="46" y2="-28"/>
    <line x1="0" y1="0" x2="-46" y2="28"/><line x1="0" y1="0" x2="46" y2="28"/>
    <ellipse cx="-46" cy="-28" rx="20" ry="5" stroke-opacity="0.85"/>
    <ellipse cx="46" cy="-28" rx="20" ry="5" stroke-opacity="0.85"/>
    <ellipse cx="-46" cy="28" rx="20" ry="5" stroke-opacity="0.85"/>
    <ellipse cx="46" cy="28" rx="20" ry="5" stroke-opacity="0.85"/>
    <circle cx="-46" cy="-28" r="3.5"/><circle cx="46" cy="-28" r="3.5"/>
    <circle cx="-46" cy="28" r="3.5"/><circle cx="46" cy="28" r="3.5"/>
    <rect x="-16" y="-11" width="32" height="22" rx="6"/>
    <circle cx="0" cy="14" r="4"/>
  </g>
  <text x="800" y="172" font-size="11" fill="#6e7681" text-anchor="middle" letter-spacing="1">DRONES</text>

  <!-- Robot head -->
  <g transform="translate(945,112)" stroke="#3FB950" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-24" x2="0" y2="-36"/><circle cx="0" cy="-40" r="3.5" fill="#3FB950"/>
    <rect x="-26" y="-22" width="52" height="44" rx="9"/>
    <circle cx="-11" cy="-3" r="5" fill="#3FB950"/><circle cx="11" cy="-3" r="5" fill="#3FB950"/>
    <line x1="-12" y1="13" x2="12" y2="13"/>
    <line x1="-30" y1="-4" x2="-30" y2="10"/><line x1="30" y1="-4" x2="30" y2="10"/>
  </g>
  <text x="945" y="172" font-size="11" fill="#6e7681" text-anchor="middle" letter-spacing="1">ROBÓTICA</text>

  <!-- RF broadcast -->
  <g transform="translate(1090,112)" stroke="#58A6FF" stroke-width="2.6" fill="none" stroke-linecap="round">
    <line x1="0" y1="-16" x2="0" y2="22"/><line x1="-9" y1="22" x2="9" y2="22"/>
    <circle cx="0" cy="-16" r="3.5" fill="#58A6FF"/>
    <path d="M7 -24 A10 10 0 0 1 7 -8"/><path d="M13 -29 A17 17 0 0 1 13 -3"/><path d="M19 -34 A24 24 0 0 1 19 2"/>
    <path d="M-7 -24 A10 10 0 0 0 -7 -8"/><path d="M-13 -29 A17 17 0 0 0 -13 -3"/><path d="M-19 -34 A24 24 0 0 0 -19 2"/>
  </g>
  <text x="1090" y="172" font-size="11" fill="#6e7681" text-anchor="middle" letter-spacing="1">RF / SUB-GHz</text>

  <!-- Row 2 -->
  <!-- PWM square wave -->
  <g transform="translate(800,228)" stroke="#D97757" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="-50,12 -50,-12 -30,-12 -30,12 -12,12 -12,-12 8,-12 8,12 24,12 24,-12 44,-12 44,12 52,12"/>
  </g>
  <text x="800" y="262" font-size="11" fill="#6e7681" text-anchor="middle" letter-spacing="1">PWM / IGBT</text>

  <!-- IC chip -->
  <g transform="translate(945,228)" stroke="#3FB950" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-26" y="-18" width="52" height="36" rx="4"/>
    <line x1="-26" y1="-10" x2="-34" y2="-10"/><line x1="-26" y1="0" x2="-34" y2="0"/><line x1="-26" y1="10" x2="-34" y2="10"/>
    <line x1="26" y1="-10" x2="34" y2="-10"/><line x1="26" y1="0" x2="34" y2="0"/><line x1="26" y1="10" x2="34" y2="10"/>
    <line x1="-10" y1="-18" x2="-10" y2="-26"/><line x1="10" y1="-18" x2="10" y2="-26"/>
    <line x1="-10" y1="18" x2="-10" y2="26"/><line x1="10" y1="18" x2="10" y2="26"/>
    <circle cx="-16" cy="-8" r="3" fill="#3FB950"/>
  </g>
  <text x="945" y="262" font-size="11" fill="#6e7681" text-anchor="middle" letter-spacing="1">CIs / DATASHEETS</text>

  <!-- Security shield -->
  <g transform="translate(1090,228)" stroke="#58A6FF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -26 L23 -15 L23 5 Q23 22 0 31 Q-23 22 -23 5 L-23 -15 Z"/>
    <polyline points="-10,0 -2,10 13,-11"/>
  </g>
  <text x="1090" y="262" font-size="11" fill="#6e7681" text-anchor="middle" letter-spacing="1">SEGURANÇA</text>
</svg>
