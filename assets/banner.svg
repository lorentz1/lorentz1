<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="hudBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11161d"/>
      <stop offset="50%" stop-color="#151c24"/>
      <stop offset="100%" stop-color="#0f141a"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b242e"/>
      <stop offset="50%" stop-color="#26323f"/>
      <stop offset="100%" stop-color="#1b242e"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Outer HUD frame -->
  <rect width="1200" height="220" rx="14" fill="url(#hudBg)"/>
  <rect x="2" y="2" width="1196" height="216" rx="12" fill="none" stroke="#2c3846" stroke-width="1.5"/>

  <!-- Corner HUD brackets -->
  <g stroke="#5eead4" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M18 42 V18 H42"/>
    <path d="M1158 18 H1182 V42"/>
    <path d="M18 178 V202 H42"/>
    <path d="M1158 202 H1182 V178"/>
  </g>

  <!-- Corner screws / nodes -->
  <g fill="#2b3644" stroke="#4b5b6e" stroke-width="1">
    <circle cx="28" cy="28" r="4"/>
    <circle cx="1172" cy="28" r="4"/>
    <circle cx="28" cy="192" r="4"/>
    <circle cx="1172" cy="192" r="4"/>
  </g>

  <!-- Subtle top & bottom HUD tick lines -->
  <g stroke="#2c3846" stroke-width="1.5">
    <line x1="120" y1="12" x2="320" y2="12"/>
    <line x1="880" y1="12" x2="1080" y2="12"/>
    <line x1="120" y1="208" x2="320" y2="208"/>
    <line x1="880" y1="208" x2="1080" y2="208"/>
  </g>

  <!-- Main Header Title -->
  <text x="600" y="64" text-anchor="middle" font-size="31" font-weight="800" letter-spacing="1.8">
    <tspan fill="#5eead4">LORENTZ</tspan>
    <tspan fill="#e6edf3"> — CYBER DEFENSE · EMBEDDED SYSTEMS · POWER ELECTRONICS</tspan>
  </text>

  <!-- Subtitle Pill with PCB Traces -->
  <rect x="72" y="88" width="1056" height="52" rx="10" fill="url(#pillBg)" stroke="#475569" stroke-width="1.2"/>

  <!-- Left PCB traces inside pill -->
  <g stroke="#64748b" stroke-width="1.2" fill="none" stroke-opacity="0.75">
    <path d="M84 102 H140 L152 114 H195"/>
    <path d="M84 114 H128 L140 126 H182"/>
    <path d="M84 126 H115 L125 134 H165"/>
    <circle cx="195" cy="114" r="2.5" fill="#5eead4" stroke="none"/>
    <circle cx="182" cy="126" r="2.5" fill="#64748b" stroke="none"/>
    <circle cx="165" cy="134" r="2" fill="#64748b" stroke="none"/>
  </g>

  <!-- Right PCB traces inside pill -->
  <g stroke="#64748b" stroke-width="1.2" fill="none" stroke-opacity="0.75">
    <path d="M1116 102 H1060 L1048 114 H1005"/>
    <path d="M1116 114 H1072 L1060 126 H1018"/>
    <path d="M1116 126 H1085 L1075 134 H1035"/>
    <circle cx="1005" cy="114" r="2.5" fill="#5eead4" stroke="none"/>
    <circle cx="1018" cy="126" r="2.5" fill="#64748b" stroke="none"/>
    <circle cx="1035" cy="134" r="2" fill="#64748b" stroke="none"/>
  </g>

  <!-- Subtitle Text inside pill -->
  <text x="600" y="121" text-anchor="middle" font-size="22" font-weight="600" fill="#f1f5f9" letter-spacing="0.6">
    Lorentz — Defesa Cibernética · Eletrônica · IoT · Robótica
  </text>

  <!-- Telemetry Status Pills -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="600" letter-spacing="0.8">
    <!-- REV pill -->
    <rect x="200" y="158" width="136" height="30" rx="6" fill="#1e2732" stroke="#334155" stroke-width="1"/>
    <text x="268" y="178" text-anchor="middle">
      <tspan fill="#cbd5e1">REV </tspan>
      <tspan fill="#5eead4">2026.1</tspan>
    </text>

    <circle cx="354" cy="173" r="2" fill="#64748b"/>

    <!-- ARCH pill -->
    <rect x="372" y="158" width="356" height="30" rx="6" fill="#1e2732" stroke="#334155" stroke-width="1"/>
    <text x="550" y="178" text-anchor="middle">
      <tspan fill="#cbd5e1">ARCH: </tspan>
      <tspan fill="#5eead4">HARDWARE + AI ORCHESTRATION</tspan>
    </text>

    <circle cx="746" cy="173" r="2" fill="#64748b"/>

    <!-- STATUS pill -->
    <rect x="764" y="158" width="236" height="30" rx="6" fill="#1e2732" stroke="#334155" stroke-width="1"/>
    <text x="882" y="178" text-anchor="middle">
      <tspan fill="#cbd5e1">STATUS: </tspan>
      <tspan fill="#5eead4">OPERATIONAL</tspan>
    </text>
  </g>
</svg>
